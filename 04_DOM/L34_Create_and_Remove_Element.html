<body style="background-color: black; color: whitesmoke;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    // it had to traverse the tree each time 
    function addLang(langname) {
        const element = document.createElement("li")
        element.innerHTML = `${langname}`
        document.querySelector(".language").appendChild(element)
    }
    addLang("TypeScript")
    addLang("Java")

    // optimized approach 
    function addoptiLang(langname) {
        const element = document.createElement("li")
        element.appendChild(document.createTextNode(langname))
        document.querySelector(".language").appendChild(element)
    }
    addoptiLang("C++")
    addoptiLang("Python")
    addoptiLang("C#")
